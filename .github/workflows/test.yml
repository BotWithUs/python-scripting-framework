name: test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels
# the run it supersedes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    # Linux only: the suite needs no Windows host, client or native module (tests/fakes.py).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the runtime bwu_host embeds and ships; 3.11 is the pyproject floor.
        python-version: ["3.12", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test
        run: python -m pytest
