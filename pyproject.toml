[project]
name = "botwithus"
version = "1.1.0"
description = "Write BotWithUs scripts in Python: game state, actions, events and walking, run by the BotWithUs native host (bwu_host)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "BotWithUs" },
]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
dependencies = [
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botwithus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
